name: Verify source-assisted entrance-bank checkpoint
on:
  push:
    paths:
      - 'research/source-assisted-entrance-banks/**'
      - '.github/workflows/source-assisted-entrance-banks.yml'
  pull_request:
    paths:
      - 'research/source-assisted-entrance-banks/**'
      - '.github/workflows/source-assisted-entrance-banks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install finite construction dependencies
        run: python -m pip install -r research/source-assisted/requirements-round13.txt
      - name: Replay both prerequisites, banks and exact assembly
        run: python -u -B research/source-assisted-entrance-banks/verify.py
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
